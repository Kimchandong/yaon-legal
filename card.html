 * @param  {BitMatrix} matrix  Modules matrix
 * @param  {Number}    version QR Code version

  const size = matrix.size
  const pos = FinderPattern.getPositions(version)

  for (let i = 0; i < pos.length; i++) {
    const row = pos[i][0]
    const col = pos[i][1]

    for (let r = -1; r <= 7; r++) {

      for (let c = -1; c <= 7; c++) {

        if ((r >= 0 && r <= 6 && (c === 0 || c === 6)) ||
          (c >= 0 && c <= 6 && (r === 0 || r === 6)) ||
          (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
          matrix.set(row + r, col + c, true, true)
        } else {
          matrix.set(row + r, col + c, false, true)

/**

 * Note: this function must be called before {@link setupAlignmentPattern}
 *
 * @param  {BitMatrix} matrix Modules matrix

  const size = matrix.size

  for (let r = 8; r < size - 8; r++) {
    const value = r % 2 === 0
    matrix.set(r, 6, value, true)
    matrix.set(6, r, value, true)

/**

 * @param  {BitMatrix} matrix  Modules matrix
 * @param  {Number}    version QR Code version

  for (let i = 0; i < pos.length; i++) {
    const row = pos[i][0]
    const col = pos[i][1]

    for (let r = -2; r <= 2; r++) {
      for (let c = -2; c <= 2; c++) {
        if (r === -2 || r === 2 || c === -2 || c === 2 ||
          (r === 0 && c === 0)) {
          matrix.set(row + r, col + c, true, true)
        } else {

 * @param  {BitMatrix} matrix  Modules matrix
 * @param  {Number}    version QR Code version

  const bits = Version.getEncodedBits(version)

    } else {

      matrix.set(8, size - i - 1, mod, true)
    } else if (i < 9) {
      matrix.set(8, 15 - i - 1 + 1, mod, true)
    } else {

    }

 * @param  {BitMatrix}  matrix Modules matrix

  segments.forEach(function (data) {

    // Prefix data with character count indicator.
    // The character count indicator is a string of bits that represents the
    // number of characters that are being encoded.
    // The character count indicator must be placed after the mode indicator
    // and must be a certain number of bits long, depending on the QR version
    // and data mode

  const ecTotalCodewords = ECCode.getTotalCodewordsCount(version, errorCorrectionLevel)

  // a terminator of up to four 0s must be added to the right side of the string.

  const dcData = new Array(ecTotalBlocks)

    // Calculate EC codewords for this data block

    th: { open: 'เปิดในแอป', loading: 'กำลังโหลดนามบัตร', closed: 'ร้านนี้ไม่ได้เปิดให้บริการแล้ว', none: 'ลิงก์นามบัตรนี้เปลี่ยนไปแล้วหรือไม่ถูกต้อง', fail: 'โหลดนามบัตรไม่ได้', retry: 'ลองอีกครั้ง', menu: 'เมนู', services: 'แพ็กเกจจอง', qr: 'สแกนด้วยแอป YAON เพื่อเปิดร้านนี้', noPrice: 'ไม่มีราคา', inApp: 'เปิดใน YAON', more: 'และอีก {0} เมนู',
      cat: { bar: 'บาร์', pub: 'ผับ · ร้านเหล้า', nightclub: 'คลับ', karaoke: 'คาราโอเกะ', biergarten: 'เบียร์การ์เดน', massage: 'นวด', restaurant: 'ร้านอาหาร' } },
    ja: { open: 'アプリで開く', loading: '名刺を読み込んでいます。', closed: '現在営業していない店舗です。', none: '名刺のアドレスが変わったか、正しくありません。', fail: '名刺を読み込めませんでした。', retry: 'もう一度', menu: 'メニュー', services: '予約プラン', qr: 'YAONアプリで読み取るとお店が開きます', noPrice: '価格なし', inApp: 'YAONで開く', more: 'ほか{0}メニュー',
      cat: { bar: 'バー', pub: 'パブ・居酒屋', nightclub: 'クラブ', karaoke: 'カラオケ', biergarten: 'ビアガーデン', massage: 'マッサージ', restaurant: 'レストラン' } }
  };
  // 업종별 색 (앱 CARD_TEMPLATES와 같음): 바탕 2색·강조·글자·보조·자간
  var TPL = {
    karaoke: ['#0B0B0C', '#2A2110', '#D4AF37', '#F7EFD8', '#CBB98A', '1px'],
    massage: ['#4A0E1E', '#1E060D', '#D9B26A', '#F8EDE6', '#D9B9AE', '0.5px'],
    bar: ['#120A24', '#2D0F52', '#C86BFF', '#F2E9FF', '#BBA6D9', '0.5px'],
    nightclub: ['#0B0B0C', '#2E0A1F', '#FF4FA3', '#FFEAF4', '#D9A3BF', '1px'],
    restaurant: ['#3B2414', '#1C110A', '#D9A066', '#F6EADC', '#CDB49A', '0']
  };
  var TPL0 = ['#121315', '#1E2A30', '#3CC8EC', '#F2F3F5', '#9A9EA6', '0'];
  var SIGN = { VND: '₫', THB: '฿', JPY: '¥', LAK: '₭', KHR: '៛', CNY: '¥' };
  var lang = (navigator.language || 'ko').slice(0, 2).toLowerCase();
  var s = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : 'en';
  var q = new URLSearchParams(location.search);
  var token = (q.get('c') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
  // #48 메뉴 포함 명함(t=menu)은 이미 보낸 링크만 그대로 열림 · 그 밖(고정 QR·t=basic)은 금박 명함
  var type = q.get('t') === 'menu' ? 'menu' : 'gold';
  var GL = {
    ko: { rep: '대표', scan: 'SCAN · 메뉴 · 예약 · 상담', yaon: 'YAON에서 상담 · 예약', h24: '24시간' },
    en: { rep: 'Owner', scan: 'SCAN · Menu · Booking · Chat', yaon: 'Chat · Book on YAON', h24: '24 hours' },
    vi: { rep: 'Chủ', scan: 'SCAN · Thực đơn · Đặt chỗ · Tư vấn', yaon: 'Tư vấn · Đặt chỗ trên YAON', h24: '24 giờ' },
    th: { rep: 'เจ้าของ', scan: 'SCAN · เมนู · จอง · แชท', yaon: 'แชท · จองผ่าน YAON', h24: '24 ชั่วโมง' },
    ja: { rep: '代表', scan: 'SCAN · メニュー · 予約 · 相談', yaon: 'YAONで相談 · 予約', h24: '24時間' }
  };
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  var show = function (id, on) { $(id).hidden = !on; };
  var state = function (text, retry) {
    show('state', true); show('card', false); show('menu', false); show('open', false);
    $('stateText').textContent = text;
    $('retry').textContent = s.retry;
    show('retry', !!retry);
  };

  function stores(st) {
    st = st || {};
    var ios = $('ios'), and = $('android');
    if (st.ios) {
      // 서버 값(app_settings.store_url_ios)이 있을 때만 버튼을 보이고, 주소는 언어 → 주소 표 그대로 (표에 없는 언어 = 서버 값 = VN 최종 주소)
      // S-iOS2 (2026-11-29) 최종 주소(이름 포함) 그대로 — 짧은 주소는 PC에서 이름 주소로 넘어갈 때 "오류가 발생했습니다" · 그 밖 언어 = VN · US 판매 안 함
      var IOS = { ko: 'https://apps.apple.com/kr/app/%EC%95%BC%EC%98%A8-yaon-%ED%95%B4%EC%99%B8-%EB%82%98%EC%9D%B4%ED%8A%B8%EB%9D%BC%EC%9D%B4%ED%94%84-%EB%8C%80%ED%99%94/id6837698293', ja: 'https://apps.apple.com/jp/app/%EC%95%BC%EC%98%A8-yaon-%ED%95%B4%EC%99%B8-%EB%82%98%EC%9D%B4%ED%8A%B8%EB%9D%BC%EC%9D%B4%ED%94%84-%EB%8C%80%ED%99%94/id6837698293', vi: 'https://apps.apple.com/vn/app/yaon-nightlife-chat-guide/id6837698293', th: 'https://apps.apple.com/th/app/yaon-nightlife-chat-guide/id6837698293', lo: 'https://apps.apple.com/la/app/yaon-nightlife-chat-guide/id6837698293', km: 'https://apps.apple.com/kh/app/yaon-nightlife-chat-guide/id6837698293' };
      ios.href = IOS[lang] || st.ios;
      // #26 iOS: 설치 후 첫 실행에서 "방금 본 ○○ 열까요?" 확인용
      ios.onclick = function () { try { if (token && navigator.clipboard) navigator.clipboard.writeText('YAON-CARD:' + token); } catch (e) {} };
    }
    if (st.android) {
      // #26 Android: 설치 정보(referrer)로 업체 토큰 전달
      and.href = token ? st.android + (st.android.indexOf('?') < 0 ? '?' : '&') + 'referrer=' + encodeURIComponent('card=' + token) : st.android;
    }
    show('ios', !!st.ios); show('android', !!st.android); show('stores', !!(st.ios || st.android));
  }

  function qrSvg(text) {
    var m = YAONQR.create(text, { errorCorrectionLevel: 'M' }).modules, n = m.size, d = '';
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (m.data[y * n + x]) d += 'M' + x + ' ' + y + 'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges"><path fill="#000" d="' + d + '"/></svg>';
  }

  // #37 저장 형식 A: 번역 칸(*_tr)이 지금 원문 것이고 이 언어가 있으면 번역, 아니면 원어
  function tr(orig, t) { return orig != null && t && t.src === orig && t[lang] ? t[lang] : orig; }

  function money(p, cur) { return p == null ? s.noPrice : (SIGN[cur] || '') + Number(p).toLocaleString('en-US'); }

  function list(title, items, cur) {
    if (!items || !items.length) return null;
    var g = el('div', 'group');
    g.appendChild(el('p', 'sec', title));
    items.forEach(function (it) {
      var r = el('div', 'row'), left = el('div', 'grow');
      left.appendChild(el('div', null, tr(it.name, it.name_tr)));
      if (it.description) left.appendChild(el('p', 'meta', tr(it.description, it.description_tr)));
      r.appendChild(left);
      if (it.price != null) r.appendChild(el('div', 'price', money(it.price, cur)));
      g.appendChild(r);
    });
    return g;
  }

  function qrBox() {
    // 고정 QR = 명함 주소(종류 없음): YAON 앱 QR 찍기 → 업체 화면, 일반 카메라 → 이 페이지
    var col = el('div', 'qrcol'), q = el('div', 'qr');
    q.setAttribute('role', 'img'); q.setAttribute('aria-label', s.qr);
    q.innerHTML = qrSvg(PAGE + '?c=' + token);
    col.appendChild(q); col.appendChild(el('span', 'sm', s.inApp));
    return col;
  }
  function line(text, cls) { return text ? el('p', cls || 'sm', text) : null; }
  function add(p, list) { list.forEach(function (c) { if (c) p.appendChild(c); }); }

  // 기본 명함 (가로 9:5): 왼쪽 업체명·업종·전화·주소·영업시간 / 오른쪽 고정 QR
  function basicCard(b) {
    var c = el('div', 'bc'), inr = el('div', 'in'), info = el('div', 'info');
    var nm = el('h1', 'cname', b.name), cat = el('p', 'sm', s.cat[b.category] || b.category);
    cat.style.color = 'var(--ta)'; cat.style.letterSpacing = 'var(--ls)';
    var ph = null;
    if (b.phone) { ph = el('p', 'sm'); var a = el('a', null, b.phone); a.href = 'tel:' + b.phone.replace(/[^+0-9]/g, ''); a.style.color = 'inherit'; a.style.textDecoration = 'none'; ph.appendChild(a); }
    add(info, [nm, cat, el('div', 'rule'), ph, line(b.address, 'sm addr2'), line(b.opening_hours)]);
    add(inr, [info, qrBox()]); c.appendChild(inr);
    return c;
  }

  // 메뉴 포함 명함 (세로 9:16): AI 배경(없으면 업종 색) + 위·아래 어두운 띠
  function menuCard(b, d) {
    var c = el('div', 'mc'), design = d.design || {};
    if (design.image) c.style.backgroundImage = 'url("' + SUPA + '/storage/v1/object/public/card-images/' + design.image.split('/').map(encodeURIComponent).join('/') + '")';
    var top = el('div', 'band top');
    add(top, [el('h1', 'cname', b.name), el('div', 'rule'), design.promo ? el('p', 'promo', design.promo) : null]);
    var bot = el('div', 'band bot'), menu = d.menu || [], shown = menu.slice(0, 5), ml = el('div', 'group');
    shown.forEach(function (m) {
      var r = el('div', 'mrow'); r.appendChild(el('span', 'n', tr(m.name, m.name_tr)));
      if (m.price != null) r.appendChild(el('span', 'p', money(m.price, b.currency)));
      ml.appendChild(r);
    });
    if (menu.length > shown.length) { var mo = el('p', 'sm', s.more.replace('{0}', menu.length - shown.length)); mo.style.color = 'var(--ts)'; mo.style.margin = '0'; ml.appendChild(mo); }
    var foot = el('div', 'foot'), info = el('div', 'info');
    var ph = null;
    if (b.phone) { ph = el('p', 'sm'); var a = el('a', null, b.phone); a.href = 'tel:' + b.phone.replace(/[^+0-9]/g, ''); a.style.color = 'inherit'; a.style.textDecoration = 'none'; ph.appendChild(a); }
    add(info, [ph, line(b.address, 'sm addr2')]);
    add(foot, [info, qrBox()]);
    add(bot, [shown.length ? ml : null, el('div', 'hr'), foot]);
    var col = el('div', 'col');
    add(col, [top, bot]); c.appendChild(col);
    return c;
  }

  // #48 금박 명함: card_public → 앱 goldData와 같은 값 → 같은 그리기 규칙(YaonGold)·엔진(YaonCard)으로 앞·뒤 캔버스
  function goldCard(d) {
    var b = d.business, c = d.card || {}, L = GL[lang] || GL.en;
    var data = {
      name: b.name, rep: c.rep_name || null, phone: b.phone || null,
      messenger: c.messenger_kind && c.messenger_id ? { kind: c.messenger_kind, id: c.messenger_id } : null,
      open: YaonGold.openText(b.opening_hours, null, L.h24), address: b.address || null,
      sub: [s.cat[b.category] || null, b.city || null].filter(Boolean).join(' · ') || null,
      intro: c.intro || null,
      logo: c.logo ? SUPA + '/storage/v1/object/public/card-logos/' + c.logo.split('/').map(encodeURIComponent).join('/') + '?v=' + encodeURIComponent(d.updated_at || '') : null,
      qr: PAGE + '?c=' + token,
      labels: { rep: L.rep, scan: L.scan, yaon: L.yaon }
    };
    var job = { front: YaonGold.frontPrims(data), back: YaonGold.backPrims(data), paperFront: 'card/paper-front.jpg', paperBack: 'card/paper-back.jpg', foil: 'card/foil.jpg', fonts: { r: 'Noto Sans KR', b: 'Noto Sans KR' } };
    var wrap = el('div', 'gold'), flip = el('div', 'flip'), fr = el('div', 'face front'), bk = el('div', 'face back');
    var said = [b.name, data.rep, b.phone, data.messenger ? data.messenger.kind.toUpperCase() + ' ' + data.messenger.id : null, data.open, b.address].filter(Boolean).join(', ');
    fr.setAttribute('role', 'img'); fr.setAttribute('aria-label', said);
    bk.setAttribute('role', 'img'); bk.setAttribute('aria-label', [b.name, data.sub, data.intro].filter(Boolean).join(', '));
    add(flip, [fr, bk]); wrap.appendChild(flip);
    var scale = Math.min(3, Math.max(1.5, (window.devicePixelRatio || 1) * 0.75));
    Promise.all([YaonCard.renderFace(job, 'front', scale), YaonCard.renderFace(job, 'back', scale)]).then(function (cv) {
      fr.appendChild(cv[0]); bk.appendChild(cv[1]); wrap.setAttribute('data-ready', '1');
    }).catch(function () { state(s.fail, true); });
    return wrap;
  }

  function render(d) {
    var b = d.business;
    document.title = b.name + ' · YAON';
    show('state', false); show('card', true);
    var t = TPL[b.category] || TPL0, root = document.documentElement.style;
    ['--t0', '--t1', '--ta', '--tt', '--ts', '--ls'].forEach(function (k, i) { root.setProperty(k, t[i]); });
    var card = $('card'); card.innerHTML = '';
    card.appendChild(type === 'menu' ? menuCard(b, d) : goldCard(d));
    // 메뉴 포함 명함: 아래에 전체 메뉴·예약 상품
    var mb = $('menuBody'); mb.innerHTML = '';
    if (type === 'menu') [list(s.menu, d.menu, b.currency), list(s.services, d.services, b.currency)].forEach(function (g) { if (g) mb.appendChild(g); });
    show('menu', !!mb.childNodes.length);
    var open = $('open'); open.textContent = s.open; open.href = 'yaon://business/' + encodeURIComponent(b.id); show('open', true);
  }

  function load() {
    state(s.loading, false);
    if (!token) { state(s.none, false); stores(null); return; }
    fetch(SUPA + '/rest/v1/rpc/card_public', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        stores(d.store);
        if (d.status === 'ok') render(d);
        else state(d.status === 'closed' ? s.closed : s.none, false);
      })
      .catch(function () { state(s.fail, true); });
  }
  $('retry').onclick = function (e) { e.preventDefault(); load(); };
  load();
})();
</script>
